name: Build and Deploy NextStep AI to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify_and_build:
    name: Verify & Build Flutter Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Build Environment
        run: |
          if [ -n "${{ secrets.GROQ_API_KEY }}" ]; then
            echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > .env
          else
            echo "# Default empty env for CI build" > .env
          fi

      - name: Run Static Code Analysis
        run: dart analyze

      - name: Run Automated Tests
        run: flutter test

      - name: Build Web Release
        run: flutter build web --release

      - name: Include Vercel SPA Routing Config
        run: |
          if [ -f vercel.json ]; then
            cp vercel.json build/web/vercel.json
          fi

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: build/web
          retention-days: 7
  deploy_vercel:
    name: Deploy to Vercel
    needs: verify_and_build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: flutter-web-build
          path: build/web

      - name: Check Vercel Credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is missing."
            exit 1
          fi
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Vercel organization or project ID is missing."
            exit 1
          fi

      - name: Install Latest Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy Flutter Web Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel deploy build/web --prod --yes --token="$VERCEL_TOKEN"
