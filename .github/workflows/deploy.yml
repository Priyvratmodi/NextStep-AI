name: Build and Deploy NextStep AI to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify_and_build:
    name: Verify & Build Flutter Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Build Environment
        run: |
          if [ -n "${{ secrets.GROQ_API_KEY }}" ]; then
            echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > .env
          else
            echo "# Default empty env for CI build" > .env
          fi

      - name: Run Static Code Analysis
        run: dart analyze

      - name: Run Automated Tests
        run: flutter test

      - name: Build Web Release
        run: flutter build web --release

      - name: Include Vercel SPA Routing Config
        run: |
          if [ -f vercel.json ]; then
            cp vercel.json build/web/vercel.json
          fi

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: build/web
          retention-days: 7

  deploy_vercel:
    name: Deploy to Vercel
    needs: verify_and_build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: flutter-web-build
          path: build/web

      - name: Check Vercel Credentials
        id: check_credentials
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::warning ::VERCEL_TOKEN secret is not configured in GitHub repository secrets. Deployment step will be skipped."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Production Build to Vercel
        if: steps.check_credentials.outputs.configured == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: build/web
